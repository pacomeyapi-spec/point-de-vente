<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080C14"/>
<title>Point de Vente</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:'Sora',sans-serif;background:#080C14;color:#DDE4F5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{--bg:#080C14;--bg2:#0D1220;--bg3:#121929;--bg4:#18213A;--card:#0F1726;--card2:#162035;--border:#1E2D4A;--border2:#263650;--text:#DDE4F5;--text2:#7A8DB0;--text3:#3D506E;--blue:#3D80FF;--blue-dim:rgba(61,128,255,0.12);--green:#00C897;--green-dim:rgba(0,200,151,0.10);--red:#FF4D6A;--red-dim:rgba(255,77,106,0.10);--amber:#FFB020;--amber-dim:rgba(255,176,32,0.10);--purple:#A855F7;--purple-dim:rgba(168,85,247,0.10);--r:14px;--rsm:9px;--rxs:6px}
.app{display:flex;flex-direction:column;min-height:100vh}
.nav{background:var(--bg2);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;position:sticky;top:0;z-index:300;gap:1rem}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-logo{width:34px;height:34px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.brand-name{font-size:15px;font-weight:700}
.brand-sub{font-size:11px;color:var(--text3);margin-top:1px}
.nav-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
.nav-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);background:var(--bg4);border:1px solid var(--border);padding:5px 12px;border-radius:20px;white-space:nowrap}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);background:var(--bg4);border:1px solid var(--border);padding:4px 10px;border-radius:20px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--red)}.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 1rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:14px 14px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;flex-shrink:0;user-select:none}
.tab:hover{color:var(--text2)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.main{flex:1;padding:1.5rem;max-width:1100px;width:100%;margin:0 auto;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1rem}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.75rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem}
.card+.card{margin-top:1rem}
.card-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:1rem;display:flex;align-items:center;gap:7px}
.card-hd .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);padding:.9rem 1rem}
.stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:5px}
.stat-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1.2}
.stat-sub{font-size:11px;color:var(--text2);margin-top:3px}
.fl{display:flex;gap:.75rem;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px}
.fg label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.iw{position:relative}.iw input{padding-right:54px!important}
.iw .cur{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;pointer-events:none}
input,select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rxs);padding:9px 12px;color:var(--text);font-size:13px;font-family:'Sora',sans-serif;outline:none;width:100%;transition:border .15s,box-shadow .15s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,128,255,0.12)}
input::placeholder{color:var(--text3)}
select option{background:var(--bg2);color:var(--text)}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type="number"]{-moz-appearance:textfield}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--rxs);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;font-family:'Sora',sans-serif;white-space:nowrap;user-select:none}
.btn:active{transform:scale(0.97)}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{filter:brightness(1.1)}
.btn-r{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,.25)}.btn-r:hover{background:rgba(255,77,106,.18)}
.btn-o{background:var(--bg4);color:var(--text2);border:1px solid var(--border)}.btn-o:hover{border-color:var(--border2);color:var(--text)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:5px}
.btn-full{width:100%}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.b-g{background:var(--green-dim);color:var(--green)}.b-r{background:var(--red-dim);color:var(--red)}.b-a{background:var(--amber-dim);color:var(--amber)}.b-b{background:var(--blue-dim);color:var(--blue)}.b-p{background:var(--purple-dim);color:var(--purple)}.b-n{background:var(--bg4);color:var(--text3)}
hr{border:none;border-top:1px solid var(--border);margin:.9rem 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:500;padding:0;opacity:0;transition:opacity .2s;pointer-events:none}
.overlay.visible{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r) var(--r) 0 0;padding:1.5rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;transform:translateY(30px);transition:transform .25s cubic-bezier(.22,.68,0,1.2)}
.overlay.visible .modal{transform:translateY(0)}
.modal-hd{font-size:16px;font-weight:700;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:-.5rem auto 1rem}
.x-btn{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;line-height:1;padding:0}.x-btn:hover{color:var(--text)}
.infobox{border-radius:var(--rsm);padding:.85rem 1rem;font-size:13px;margin-bottom:1rem;border:1px solid;line-height:1.5}
.info-ok{background:var(--green-dim);color:var(--green);border-color:rgba(0,200,151,.3)}
.info-ko{background:var(--red-dim);color:var(--red);border-color:rgba(255,77,106,.3)}
.info-warn{background:var(--amber-dim);color:var(--amber);border-color:rgba(255,176,32,.3)}
.info-info{background:var(--blue-dim);color:var(--blue);border-color:rgba(61,128,255,.3)}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.shdr-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2)}
.acc-section{border-bottom:1px solid var(--border);padding:.85rem 0}.acc-section:last-child{border-bottom:none}
.acc-section-name{font-size:13px;font-weight:700;margin-bottom:.5rem}
.acc-section-hint{font-size:11px;color:var(--text3);margin-top:2px;margin-bottom:.5rem}
.resume-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.resume-line:last-child{border-bottom:none}
.resume-label{font-size:13px;color:var(--text2)}
.resume-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600}
.resume-total{padding:10px 12px;border-radius:var(--rxs);display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
.adj-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.adj-item:last-child{border-bottom:none}
.adj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;overflow:hidden}
.hist-hdr{padding:1rem 1.25rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.hist-hdr:hover{background:var(--card2)}
.hist-body{padding:0 1.25rem 1.25rem;display:none}.hist-body.open{display:block}
.table-wrap{overflow-x:auto;border-radius:var(--rsm)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.mono{font-family:'JetBrains Mono',monospace}
.acc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;transition:border-color .2s}
.acc-card:hover{border-color:var(--border2)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px;line-height:1.7}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:1px solid var(--border2);border-radius:30px;padding:10px 20px;font-size:13px;font-weight:600;z-index:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:var(--green);border-color:rgba(0,200,151,.35)}.toast.err{color:var(--red);border-color:rgba(255,77,106,.35)}
.loader{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--text3);font-size:13px;gap:.75rem}
.spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@media(max-width:640px){.main{padding:1rem}.nav{padding:0 1rem}.tabs{padding:0 .75rem}.tab{padding:12px 10px;font-size:12px}.brand-sub{display:none}.g4{grid-template-columns:repeat(2,1fr)}.stat-val{font-size:17px}.card{padding:1rem}.sync-pill span{display:none}}
@media(min-width:641px){.overlay{align-items:center;padding:1.5rem}.modal{border-radius:var(--r);max-height:85vh}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand">
      <div class="brand-logo">PV</div>
      <div><div class="brand-name">Point de Vente</div><div class="brand-sub">Gestion journalière</div></div>
    </div>
    <div class="nav-right">
      <div class="sync-pill" id="syncPill"><div class="sync-dot loading" id="syncDot"></div><span id="syncTxt">Connexion...</span></div>
      <div class="nav-date" id="navDate">—</div>
    </div>
  </nav>
  <div class="tabs">
    <div class="tab on" id="tab-dashboard" onclick="go('dashboard')">📊 Tableau de bord</div>
    <div class="tab" id="tab-accounts"  onclick="go('accounts')">💳 Comptes</div>
    <div class="tab" id="tab-journee"   onclick="go('journee')">📋 Journée</div>
    <div class="tab" id="tab-history"   onclick="go('history')">📅 Historique</div>
  </div>
  <div class="main" id="main"><div class="loader"><div class="spinner"></div>Chargement...</div></div>
</div>
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal"><div class="modal-handle"></div><div id="modalContent"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = '';
let accounts = [];
let dayData   = { morning:{}, evening:{}, adjustments:[], managerCash:0, eveningManagerCash:0, closed:false };
let tab       = 'dashboard';

function today() {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(ds) {
  return new Date(ds+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function fmtShort(ds) {
  return new Date(ds+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmt(n) { return Math.round(Number(n)||0).toLocaleString('fr-FR')+' F'; }

async function api(method, path, body) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API+path, opts);
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function setSync(state, txt) {
  document.getElementById('syncDot').className = 'sync-dot '+state;
  document.getElementById('syncTxt').textContent = txt;
}

async function loadAll() {
  try {
    setSync('loading','Sync...');
    [accounts, dayData] = await Promise.all([
      api('GET','/api/accounts'),
      api('GET','/api/days/'+today())
    ]);
    setSync('ok','Synchronisé');
  } catch {
    setSync('err','Hors ligne');
    toast('Impossible de joindre le serveur','err');
  }
}

function currentBal(accountId) {
  let bal = dayData.morning[accountId]?.balance || 0;
  (dayData.adjustments||[]).forEach(a => {
    if (a.account_id===accountId) bal = a.type==='add' ? bal+a.amount : bal-a.amount;
  });
  return bal;
}
function totals() {
  const morCash = accounts.reduce((s,a)=>s+(dayData.morning[a.id]?.cash||0),0);
  const morBal  = accounts.reduce((s,a)=>s+(dayData.morning[a.id]?.balance||0),0);
  const eveCash = accounts.reduce((s,a)=>s+(dayData.evening[a.id]?.cash||0),0);
  const eveBal  = accounts.reduce((s,a)=>s+(dayData.evening[a.id]?.balance||0),0);
  const totalRemis = (dayData.managerCash||0)+morCash;
  const totalRecu  = (dayData.eveningManagerCash||0)+eveCash;
  return {morBal,morCash,eveBal,eveCash,totalRemis,totalRecu,diff:totalRemis-totalRecu};
}

function go(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('on'));
  document.getElementById('tab-'+t)?.classList.add('on');
  const m = document.getElementById('main');
  m.style.animation='none';
  requestAnimationFrame(()=>{ m.style.animation=''; render(); });
}

function render() {
  document.getElementById('navDate').textContent = fmtShort(today());
  const c = document.getElementById('main'); c.innerHTML='';
  if      (tab==='dashboard') rDashboard(c);
  else if (tab==='accounts')  rAccounts(c);
  else if (tab==='journee')   rJournee(c);
  else if (tab==='history')   rHistory(c);
}

function rDashboard(c) {
  const t = totals();
  const hasMorning = Object.keys(dayData.morning).length>0;
  const dc = t.diff===0?'var(--green)':t.diff>0?'var(--red)':'var(--amber)';
  const dCls = t.diff===0?'info-ok':t.diff>0?'info-ko':'info-warn';
  const dMsg = t.diff===0?'✓ Les espèces correspondent parfaitement.'
    :t.diff>0?'⚠ Écart de <strong>'+fmt(t.diff)+'</strong> — le gérant vous doit encore de l'argent.'
    :'⚠ Écart de <strong>'+fmt(Math.abs(t.diff))+'</strong> — vous avez reçu plus que remis.';

  c.innerHTML=`
  <div style="margin-bottom:1rem">
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px">Aujourd'hui</div>
    <div style="font-size:18px;font-weight:700">${fmtDate(today())}</div>
    <div style="display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap">
      <span class="badge ${hasMorning?'b-g':'b-a'}">${hasMorning?'✓ Matin enregistré':'Matin non saisi'}</span>
      <span class="badge ${dayData.closed?'b-p':'b-a'}">${dayData.closed?'✓ Journée clôturée':'Pas encore clôturée'}</span>
    </div>
  </div>
  ${!hasMorning?'<div class="infobox info-info">Vous n'avez pas encore saisi les données du matin. Allez dans l'onglet <strong>Journée</strong> pour commencer.</div>':''}
  ${dayData.closed?'<div class="infobox '+dCls+'">'+dMsg+'</div>':''}
  <div class="g4" style="margin-bottom:1rem">
    <div class="stat"><div class="stat-lbl">Total remis (matin)</div><div class="stat-val" style="color:var(--amber)">${fmt(t.totalRemis)}</div><div class="stat-sub">comptes + gérant</div></div>
    <div class="stat"><div class="stat-lbl">Total reçu (soir)</div><div class="stat-val" style="color:var(--purple)">${fmt(t.totalRecu)}</div><div class="stat-sub">comptes + gérant</div></div>
    <div class="stat"><div class="stat-lbl">Écart</div><div class="stat-val" style="color:${dc}">${t.diff===0?'= 0':(t.diff>0?'-':'+')+fmt(Math.abs(t.diff))}</div><div class="stat-sub">${t.diff===0?'Équilibré':t.diff>0?'Déficit':'Excédent'}</div></div>
    <div class="stat"><div class="stat-lbl">Comptes</div><div class="stat-val" style="color:var(--blue)">${accounts.length}</div><div class="stat-sub">enregistrés</div></div>
  </div>
  <div class="g2">
    <div class="card">
      <div class="card-hd"><div class="dot" style="background:var(--amber)"></div>Récapitulatif espèces</div>
      <div class="resume-line"><span class="resume-label">Espèces remises matin (comptes)</span><span class="resume-val" style="color:var(--amber)">${fmt(t.morCash)}</span></div>
      <div class="resume-line"><span class="resume-label">Espèces remises au gérant</span><span class="resume-val" style="color:var(--amber)">${fmt(dayData.managerCash||0)}</span></div>
      <div class="resume-total" style="background:var(--amber-dim);border:1px solid rgba(255,176,32,.2);margin-bottom:.75rem">
        <span style="font-size:13px;font-weight:700">Total remis matin</span>
        <span class="mono" style="color:var(--amber);font-size:16px;font-weight:700">${fmt(t.totalRemis)}</span>
      </div>
      <div class="resume-line"><span class="resume-label">Espèces reçues (comptes soir)</span><span class="resume-val" style="color:var(--purple)">${fmt(t.eveCash)}</span></div>
      <div class="resume-line"><span class="resume-label">Espèces reçues du gérant</span><span class="resume-val" style="color:var(--purple)">${fmt(dayData.eveningManagerCash||0)}</span></div>
      <div class="resume-total" style="background:var(--purple-dim);border:1px solid rgba(168,85,247,.2)">
        <span style="font-size:13px;font-weight:700">Total reçu soir</span>
        <span class="mono" style="color:var(--purple);font-size:16px;font-weight:700">${fmt(t.totalRecu)}</span>
      </div>
      <div class="resume-total" style="margin-top:.75rem;background:${t.diff===0?'var(--green-dim)':t.diff>0?'var(--red-dim)':'var(--amber-dim)'};border:1px solid ${t.diff===0?'rgba(0,200,151,.3)':t.diff>0?'rgba(255,77,106,.3)':'rgba(255,176,32,.3)'}">
        <span style="font-size:14px;font-weight:700">Écart final</span>
        <span class="mono" style="color:${dc};font-size:18px;font-weight:700">${t.diff===0?'= 0':(t.diff>0?'-':'+')+fmt(Math.abs(t.diff))}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-hd"><div class="dot" style="background:var(--blue)"></div>État des soldes</div>
      ${accounts.length===0?'<div class="empty">Aucun compte. <span style="color:var(--blue);cursor:pointer" onclick="go('accounts')">Créer des comptes →</span></div>':''}
      ${accounts.map(a=>{
        const cur=currentBal(a.id); const ev=dayData.evening[a.id];
        return '<div class="resume-line"><div><div style="font-size:13px;font-weight:600">'+a.name+'</div><div style="font-size:11px;color:var(--text3)">'+a.type+'</div></div><div style="text-align:right">'+
          (hasMorning?'<div class="mono" style="font-size:13px;color:var(--blue)">'+fmt(cur)+'</div>':'<div style="font-size:12px;color:var(--text3)">—</div>')+
          (ev?'<div style="font-size:11px;color:var(--purple)">soir: '+fmt(ev.balance)+'</div>':'')+
        '</div></div>';
      }).join('')}
    </div>
  </div>
  ${!hasMorning?'<div style="text-align:center;margin-top:1.5rem"><button class="btn btn-p" onclick="go('journee')" style="padding:12px 28px;font-size:14px">📋 Commencer la journée →</button></div>'
  :!dayData.closed?'<div style="text-align:center;margin-top:1.5rem"><button class="btn" style="background:var(--purple);color:#fff;padding:12px 28px;font-size:14px" onclick="go('journee')">🌙 Saisir la clôture du soir →</button></div>':''}`;
}

function rAccounts(c) {
  c.innerHTML=`
  <div class="shdr"><div class="shdr-title">Gestion des comptes</div><button class="btn btn-p" onclick="openCreateAcc()">+ Nouveau compte</button></div>
  ${accounts.length===0?'<div class="card"><div class="empty">Aucun compte créé. Créez vos comptes pour commencer.</div></div>'
  :'<div class="g2">'+accounts.map(a=>`
    <div class="acc-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div style="font-size:14px;font-weight:700">${a.name}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${a.type}</div></div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-o btn-sm" onclick="openEditAcc('${a.id}')">Modifier</button>
          <button class="btn btn-r btn-sm" onclick="delAcc('${a.id}')">✕</button>
        </div>
      </div>
    </div>`).join('')+'</div>'}`;
}

function rJournee(c) {
  const hasMorning = Object.keys(dayData.morning).length>0;
  if (accounts.length===0) {
    c.innerHTML='<div class="card"><div class="empty">Aucun compte. <span style="color:var(--blue);cursor:pointer" onclick="go('accounts')">Créez d'abord des comptes →</span></div></div>';
    return;
  }
  let html=`
  <div style="margin-bottom:1.25rem">
    <div style="font-size:18px;font-weight:700;margin-bottom:.4rem">${fmtDate(today())}</div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <span class="badge ${hasMorning?'b-g':'b-a'}">${hasMorning?'✓ Matin saisi':'Matin non saisi'}</span>
      <span class="badge ${dayData.closed?'b-p':'b-a'}">${dayData.closed?'✓ Clôturé':'Pas encore clôturé'}</span>
    </div>
  </div>
  <div class="card" style="margin-bottom:1rem">
    <div class="card-hd"><div class="dot" style="background:var(--amber)"></div>Saisie du matin</div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:1rem;line-height:1.6">Renseignez le solde disponible et les espèces remises pour chaque compte.</p>
    ${accounts.map(a=>{
      const m=dayData.morning[a.id]||{balance:'',cash:''};
      return `<div class="acc-section">
        <div class="acc-section-name">${a.name} <span class="badge b-n">${a.type}</span></div>
        <div class="fl">
          <div class="fg"><label>Solde disponible</label><div class="iw"><input type="number" inputmode="numeric" id="m-bal-${a.id}" value="${m.balance}" placeholder="0" min="0"/><span class="cur">FCFA</span></div></div>
          <div class="fg"><label>Espèces remises</label><div class="iw"><input type="number" inputmode="numeric" id="m-cash-${a.id}" value="${m.cash}" placeholder="0" min="0"/><span class="cur">FCFA</span></div></div>
        </div>
      </div>`;
    }).join('')}
    <div class="acc-section">
      <div class="acc-section-name">💼 Espèces remises directement au gérant</div>
      <div class="fl">
        <div class="fg"><label>Montant</label><div class="iw"><input type="number" inputmode="numeric" id="m-mgr" value="${dayData.managerCash||''}" placeholder="0" min="0"/><span class="cur">FCFA</span></div></div>
        <div class="fg"></div>
      </div>
    </div>
    <div style="margin-top:1rem"><button class="btn btn-p btn-full" onclick="saveMorning()">✓ Enregistrer les données du matin</button></div>
  </div>`;

  if (hasMorning) {
    html+=`
    <div class="card" style="margin-bottom:1rem">
      <div class="card-hd" style="justify-content:space-between">
        <span style="display:flex;align-items:center;gap:7px"><div class="dot" style="background:var(--blue)"></div>Ajustements de la journée</span>
        <button class="btn btn-o btn-sm" onclick="openAdj()">+ Ajustement</button>
      </div>
      <p style="font-size:12px;color:var(--text2);margin-bottom:.75rem;line-height:1.6">Ajoutez ou soustrayez un montant si nécessaire en cours de journée.</p>
      ${(dayData.adjustments||[]).length===0?'<div style="font-size:12px;color:var(--text3);padding:.5rem 0">Aucun ajustement aujourd'hui.</div>'
      :(dayData.adjustments||[]).map(a=>{
        const acc=accounts.find(x=>x.id===a.account_id);
        return `<div class="adj-item">
          <div class="adj-dot" style="background:${a.type==='add'?'var(--green)':'var(--red)'}"></div>
          <div style="flex:1;min-width:0"><div style="font-weight:600">${acc?.name||'—'}</div><div style="font-size:11px;color:var(--text3)">${a.reason||'Sans motif'}</div></div>
          <div class="mono" style="color:${a.type==='add'?'var(--green)':'var(--red)'};font-weight:600">${a.type==='add'?'+':'-'}${fmt(a.amount)}</div>
          <button class="btn btn-r btn-sm" onclick="delAdj('${a.id}')">✕</button>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="card-hd"><div class="dot" style="background:var(--purple)"></div>Saisie du soir — Clôture</div>
      <p style="font-size:12px;color:var(--text2);margin-bottom:1rem;line-height:1.6">Vérifiez le solde final de chaque compte et renseignez les espèces reçues du gérant.</p>
      ${accounts.map(a=>{
        const ev=dayData.evening[a.id]||{balance:'',cash:''};
        const cur=currentBal(a.id);
        return `<div class="acc-section">
          <div class="acc-section-name">${a.name}</div>
          <div class="acc-section-hint">Solde théorique actuel : <span class="mono" style="color:var(--blue)">${fmt(cur)}</span></div>
          <div class="fl">
            <div class="fg"><label>Solde disponible soir</label><div class="iw"><input type="number" inputmode="numeric" id="e-bal-${a.id}" value="${ev.balance}" placeholder="${cur}" min="0"/><span class="cur">FCFA</span></div></div>
            <div class="fg"><label>Espèces reçues soir</label><div class="iw"><input type="number" inputmode="numeric" id="e-cash-${a.id}" value="${ev.cash}" placeholder="0" min="0"/><span class="cur">FCFA</span></div></div>
          </div>
        </div>`;
      }).join('')}
      <div class="acc-section">
        <div class="acc-section-name">💼 Espèces reçues du gérant (directement)</div>
        <div class="fl">
          <div class="fg"><label>Montant</label><div class="iw"><input type="number" inputmode="numeric" id="e-mgr" value="${dayData.eveningManagerCash||''}" placeholder="0" min="0"/><span class="cur">FCFA</span></div></div>
          <div class="fg"></div>
        </div>
      </div>
      <div style="margin-top:1rem"><button class="btn btn-full" style="background:var(--purple);color:#fff" onclick="saveEvening()">🌙 Clôturer la journée</button></div>
    </div>`;
  }
  c.innerHTML=html;
}

async function rHistory(c) {
  c.innerHTML='<div class="loader"><div class="spinner"></div>Chargement de l'historique...</div>';
  let dates=[];
  try { dates=await api('GET','/api/history'); } catch { c.innerHTML='<div class="card"><div class="empty">Impossible de charger l'historique.</div></div>'; return; }
  if (dates.length===0) { c.innerHTML='<div class="shdr"><div class="shdr-title">Historique</div></div><div class="card"><div class="empty">Aucune journée enregistrée.</div></div>'; return; }

  const rows = await Promise.all(dates.map(d=>api('GET','/api/days/'+d).catch(()=>null)));
  let html='<div class="shdr"><div class="shdr-title">Historique des journées</div></div>';
  rows.forEach((day,i)=>{
    if (!day) return;
    const date=dates[i];
    const morCash=accounts.reduce((s,a)=>s+(day.morning[a.id]?.cash||0),0);
    const eveCash=accounts.reduce((s,a)=>s+(day.evening[a.id]?.cash||0),0);
    const totalRemis=(day.managerCash||0)+morCash;
    const totalRecu=(day.eveningManagerCash||0)+eveCash;
    const diff=totalRemis-totalRecu;
    const dc=diff===0?'var(--green)':diff>0?'var(--red)':'var(--amber)';
    const isToday=date===today();
    html+=`
    <div class="hist-card">
      <div class="hist-hdr" onclick="toggleHist('${date}')">
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;margin-bottom:5px">${fmtDate(date)} ${isToday?'<span class="badge b-b" style="font-size:9px">Aujourd\'hui</span>':''}</div>
          <div style="display:flex;gap:.4rem;flex-wrap:wrap">
            ${day.closed?'<span class="badge b-g">Clôturée</span>':Object.keys(day.morning).length>0?'<span class="badge b-a">En cours</span>':'<span class="badge b-n">Vide</span>'}
            ${day.closed?'<span class="badge" style="background:${diff===0?'var(--green-dim)':diff>0?'var(--red-dim)':'var(--amber-dim)'};color:${dc}">${diff===0?'Équilibré':diff>0?'Déficit '+fmt(diff):'Excédent '+fmt(Math.abs(diff))}</span>':''}
          </div>
        </div>
        <span style="color:var(--text3);font-size:14px" id="ha-${date}">▾</span>
      </div>
      <div class="hist-body" id="hb-${date}">
        <div class="g3" style="margin-bottom:1rem">
          <div class="stat"><div class="stat-lbl">Remis matin</div><div class="stat-val" style="font-size:16px;color:var(--amber)">${fmt(totalRemis)}</div></div>
          <div class="stat"><div class="stat-lbl">Reçu soir</div><div class="stat-val" style="font-size:16px;color:var(--purple)">${fmt(totalRecu)}</div></div>
          <div class="stat"><div class="stat-lbl">Écart</div><div class="stat-val" style="font-size:16px;color:${dc}">${diff===0?'= 0':(diff>0?'-':'+')+fmt(Math.abs(diff))}</div></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Compte</th><th>Solde matin</th><th>Esp. matin</th><th>Solde soir</th><th>Esp. soir</th></tr></thead>
            <tbody>
              ${accounts.map(a=>{
                const m=day.morning[a.id]; const ev=day.evening[a.id];
                return `<tr>
                  <td style="font-weight:600">${a.name}<br><span style="font-size:10px;color:var(--text3)">${a.type}</span></td>
                  <td class="mono">${m?fmt(m.balance):'—'}</td>
                  <td class="mono" style="color:var(--amber)">${m?fmt(m.cash):'—'}</td>
                  <td class="mono">${ev?fmt(ev.balance):'—'}</td>
                  <td class="mono" style="color:var(--purple)">${ev?fmt(ev.cash):'—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  });
  c.innerHTML=html;
}

function toggleHist(d) {
  const b=document.getElementById('hb-'+d),a=document.getElementById('ha-'+d);
  if (!b) return;
  b.classList.toggle('open');
  a.textContent=b.classList.contains('open')?'▴':'▾';
}

async function saveMorning() {
  const accs={};
  accounts.forEach(a=>{ accs[a.id]={ balance:parseFloat(document.getElementById('m-bal-'+a.id)?.value)||0, cash:parseFloat(document.getElementById('m-cash-'+a.id)?.value)||0 }; });
  const managerCash=parseFloat(document.getElementById('m-mgr')?.value)||0;
  try {
    setSync('loading','Sauvegarde...');
    await api('POST','/api/days/'+today()+'/morning',{accounts:accs,managerCash});
    dayData=await api('GET','/api/days/'+today());
    setSync('ok','Synchronisé');
    toast('Données du matin enregistrées ✓','ok');
    render();
  } catch { setSync('err','Erreur'); toast('Erreur de sauvegarde','err'); }
}

async function saveEvening() {
  const accs={};
  accounts.forEach(a=>{
    const b=parseFloat(document.getElementById('e-bal-'+a.id)?.value);
    const cs=parseFloat(document.getElementById('e-cash-'+a.id)?.value);
    accs[a.id]={ balance:isNaN(b)?currentBal(a.id):b, cash:isNaN(cs)?0:cs };
  });
  const eveningManagerCash=parseFloat(document.getElementById('e-mgr')?.value)||0;
  try {
    setSync('loading','Sauvegarde...');
    await api('POST','/api/days/'+today()+'/evening',{accounts:accs,eveningManagerCash});
    dayData=await api('GET','/api/days/'+today());
    setSync('ok','Synchronisé');
    toast('Journée clôturée ✓','ok');
    go('dashboard');
  } catch { setSync('err','Erreur'); toast('Erreur de sauvegarde','err'); }
}

function openAdj() {
  openModal(`
    <div class="modal-hd">Ajustement <button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="fg" style="margin-bottom:.75rem"><label>Compte</label>
      <select id="aj-acc">${accounts.map(a=>'<option value="'+a.id+'">'+a.name+'</option>').join('')}</select></div>
    <div class="fg" style="margin-bottom:.75rem"><label>Type</label>
      <select id="aj-type"><option value="add">Ajout (+)</option><option value="sub">Soustraction (−)</option></select></div>
    <div class="fg" style="margin-bottom:.75rem"><label>Montant</label>
      <div class="iw"><input type="number" inputmode="numeric" id="aj-amt" placeholder="0" min="1"/><span class="cur">FCFA</span></div></div>
    <div class="fg" style="margin-bottom:1.25rem"><label>Motif (optionnel)</label>
      <input type="text" id="aj-reason" placeholder="Ex : rechargement, erreur..."/></div>
    <button class="btn btn-p btn-full" onclick="saveAdj()">Enregistrer l'ajustement</button>`);
}
async function saveAdj() {
  const amount=parseFloat(document.getElementById('aj-amt')?.value);
  if (!amount||amount<=0) { toast('Montant invalide','err'); return; }
  try {
    await api('POST','/api/days/'+today()+'/adjustments',{ accountId:document.getElementById('aj-acc').value, type:document.getElementById('aj-type').value, amount, reason:document.getElementById('aj-reason')?.value.trim()||'' });
    dayData=await api('GET','/api/days/'+today());
    closeModal(); toast('Ajustement enregistré ✓','ok'); render();
  } catch { toast('Erreur','err'); }
}
async function delAdj(id) {
  if (!confirm('Supprimer cet ajustement ?')) return;
  try {
    await api('DELETE','/api/adjustments/'+id);
    dayData=await api('GET','/api/days/'+today());
    toast('Supprimé','ok'); render();
  } catch { toast('Erreur','err'); }
}

function openCreateAcc() {
  openModal(`
    <div class="modal-hd">Nouveau compte <button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="fg" style="margin-bottom:.75rem"><label>Nom *</label>
      <input id="ac-name" placeholder="Ex : Wave CI, Orange Money..."/></div>
    <div class="fg" style="margin-bottom:1.25rem"><label>Type</label>
      <select id="ac-type"><option>Mobile Money</option><option>Espèces</option><option>Bancaire</option><option>Autre</option></select></div>
    <button class="btn btn-p btn-full" onclick="createAcc()">Créer le compte</button>`);
}
async function createAcc() {
  const name=document.getElementById('ac-name')?.value.trim();
  if (!name) { toast('Nom requis','err'); return; }
  try {
    await api('POST','/api/accounts',{name,type:document.getElementById('ac-type').value});
    accounts=await api('GET','/api/accounts');
    closeModal(); toast('Compte créé ✓','ok'); render();
  } catch { toast('Erreur','err'); }
}
function openEditAcc(id) {
  const a=accounts.find(x=>x.id===id); if (!a) return;
  openModal(`
    <div class="modal-hd">Modifier — ${a.name} <button class="x-btn" onclick="closeModal()">✕</button></div>
    <div class="fg" style="margin-bottom:.75rem"><label>Nom</label><input id="ac-name" value="${a.name}"/></div>
    <div class="fg" style="margin-bottom:1.25rem"><label>Type</label>
      <select id="ac-type">${['Mobile Money','Espèces','Bancaire','Autre'].map(t=>'<option'+(a.type===t?' selected':'')+'>'+t+'</option>').join('')}</select></div>
    <button class="btn btn-p btn-full" onclick="updateAcc('${id}')">Enregistrer</button>`);
}
async function updateAcc(id) {
  const name=document.getElementById('ac-name')?.value.trim();
  try {
    await api('PUT','/api/accounts/'+id,{name,type:document.getElementById('ac-type').value});
    accounts=await api('GET','/api/accounts');
    closeModal(); toast('Compte mis à jour ✓','ok'); render();
  } catch { toast('Erreur','err'); }
}
async function delAcc(id) {
  if (!confirm('Supprimer ce compte ?')) return;
  try {
    await api('DELETE','/api/accounts/'+id);
    accounts=await api('GET','/api/accounts');
    toast('Supprimé','ok'); render();
  } catch { toast('Erreur','err'); }
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML=html;
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  requestAnimationFrame(()=>ov.classList.add('visible'));
}
function closeModal() {
  const ov=document.getElementById('overlay');
  ov.classList.remove('visible');
  setTimeout(()=>{ ov.style.display='none'; },220);
}
function overlayClick(e) { if (e.target===document.getElementById('overlay')) closeModal(); }

let toastTimer;
function toast(msg,type='ok') {
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast '+type+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

(async()=>{ await loadAll(); render(); })();
</script>
</body>
</html>
